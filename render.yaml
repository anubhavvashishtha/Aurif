# Render blueprint for the Flask API. Frontends deploy separately on Vercel.
# Dashboard: New → Blueprint → select this repo. Root directory for the service
# is `server` (set below). Secrets stay blank here; fill them in the dashboard.
# A persistent disk requires a paid instance type. On the free tier, delete the
# `disk` block and the AURIF_STORE_PATH variable — the store is re-seeded on
# every boot (see DEPLOY.md).
services:
  - type: web
    name: aurif-api
    runtime: python
    rootDir: server
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AURIF_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: AURIF_STORE_PATH
        value: /var/data/store.json
      - key: AURIF_API_PUBLIC_URL
        sync: false
      - key: CUSTOMER_SITE_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: AURIF_CORS_ORIGINS
        sync: false
      - key: AURIF_SITE_KEY
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: META_API_KEY
        sync: false
      - key: BASETEN_API_KEY
        sync: false
      - key: BASETEN_MODEL
        sync: false
      - key: META_MODEL
        sync: false
      - key: META_BASE_URL
        sync: false
      - key: META_VISION_MODEL
        sync: false
      - key: META_VISION_BASE_URL
        sync: false
      - key: META_VISION_API_KEY
        sync: false
    disk:
      name: aurif-store
      mountPath: /var/data
      sizeGB: 1
