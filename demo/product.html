<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product — Northline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Sora:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Northline</a>
      <nav class="nav">
        <a href="/products">Shop</a>
        <a href="/cart">Cart</a>
      </nav>
    </header>

    <section class="section" id="detail">
      <p class="note">Loading…</p>
    </section>

    <footer>© Northline Goods</footer>
    <script src="/sdk/aurif.js" data-aurif-site="demo-shop"></script>
    <script>
      const cartKey = "northline-cart";
      const id = location.pathname.split("/").pop();

      function addToCart(pid) {
        const cart = JSON.parse(localStorage.getItem(cartKey) || "[]");
        cart.push(pid);
        localStorage.setItem(cartKey, JSON.stringify(cart));
        alert("Added to cart");
      }

      fetch("/api/products")
        .then((r) => r.json())
        .then(({ products }) => {
          const p = products.find((x) => x.id === id);
          const el = document.getElementById("detail");
          if (!p) {
            el.innerHTML = "<h2>Not found</h2><p><a href='/products'>Back to shop</a></p>";
            return;
          }
          document.title = p.name + " — Northline";
          el.innerHTML = `
            <p class="note"><a href="/products">← Shop</a></p>
            <h2>${p.name}</h2>
            <p class="lead">${p.summary}</p>
            <p class="price">$${p.price}</p>
            <p style="margin-top:1.25rem">
              <button class="btn btn-primary" type="button" onclick="addToCart('${p.id}')">
                Add to cart
              </button>
            </p>`;
        });
    </script>
  </body>
</html>
