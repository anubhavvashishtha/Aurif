<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop — Northline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Sora:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Northline</a>
      <nav class="nav">
        <a href="/products">Shop</a>
        <a href="/cart">Cart</a>
      </nav>
    </header>

    <section class="section">
      <h2>Shop</h2>
      <p class="lead">Everything in stock ships within two business days.</p>
      <div class="product-list" id="products"></div>
    </section>

    <footer>© Northline Goods</footer>
    <script src="/sdk/aurif.js" data-aurif-site="demo-shop"></script>
    <script>
      const cartKey = "northline-cart";

      function addToCart(id) {
        const cart = JSON.parse(localStorage.getItem(cartKey) || "[]");
        cart.push(id);
        localStorage.setItem(cartKey, JSON.stringify(cart));
        alert("Added to cart");
      }

      fetch("/api/products")
        .then((r) => r.json())
        .then(({ products }) => {
          document.getElementById("products").innerHTML = products
            .map(
              (p) => `
            <div class="product-row">
              <div>
                <h3><a href="/products/${p.id}">${p.name}</a></h3>
                <p>${p.summary}</p>
              </div>
              <div style="text-align:right;display:grid;gap:0.5rem;justify-items:end">
                <span class="price">$${p.price}</span>
                <button class="btn btn-primary" type="button" onclick="addToCart('${p.id}')">
                  Add to cart
                </button>
              </div>
            </div>`
            )
            .join("");
        });
    </script>
  </body>
</html>
