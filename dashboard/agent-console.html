<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent console — Aurif</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/dashboard.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/dashboard">Aurif <span>Dashboard</span></a>
      <div class="row">
        <a class="btn btn-ghost" href="/dashboard">Back to dashboard</a>
        <a class="btn btn-ghost" href="/" target="_blank" rel="noopener"
          >Open customer site ↗</a
        >
      </div>
    </header>

    <main class="shell">
      <div class="panel" style="margin-bottom: 1rem">
        <h2>Agent console</h2>
        <p class="lead">
          This is an Aurif product tool — not part of the customer website. It
          talks only to AI endpoints (<code>/.well-known/aurif.json</code>,
          <code>/ai/*</code>). No vision / mouse clicking on the human UI.
        </p>
      </div>

      <div class="layout" style="grid-template-columns: 1fr 1fr">
        <div class="panel">
          <p>
            Status:
            <span class="badge" id="status">not connected</span>
          </p>

          <div class="field">
            <label for="agent_id">Agent id</label>
            <input id="agent_id" value="third-party-agent" />
          </div>
          <div class="field">
            <label for="scopes">Requested scopes</label>
            <select id="scopes">
              <option value="view,act">view + act</option>
              <option value="view">view only</option>
            </select>
          </div>
          <div class="field">
            <label for="purpose">Purpose</label>
            <input
              id="purpose"
              value="Help user browse Northline and add one item to cart"
            />
          </div>
          <div class="field">
            <label for="site_key">Site key (optional)</label>
            <input id="site_key" placeholder="from Site credentials" />
          </div>
          <div class="field">
            <label for="page_path">AI page path</label>
            <input id="page_path" value="/" />
          </div>

          <div class="row">
            <button class="btn" type="button" id="btn-discover">1. Discover</button>
            <button class="btn" type="button" id="btn-handshake">2. Handshake</button>
            <button class="btn btn-ghost" type="button" id="btn-page">3. Get page</button>
            <button class="btn btn-ghost" type="button" id="btn-add">4. Add field tote</button>
            <button class="btn btn-ghost" type="button" id="btn-audit">Audit</button>
          </div>
        </div>

        <div class="panel">
          <p class="mono" style="margin-top: 0">Response log</p>
          <pre
            class="mono"
            id="log"
            style="
              max-height: 420px;
              overflow: auto;
              white-space: pre-wrap;
              word-break: break-word;
              margin: 0;
              font-size: 0.78rem;
              line-height: 1.45;
            "
          ></pre>
        </div>
      </div>
    </main>

    <script src="/sdk/aurif.js" data-aurif-site="demo-shop"></script>
    <script>
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");

      function log(label, data) {
        const stamp = new Date().toISOString().slice(11, 19);
        logEl.textContent =
          `[${stamp}] ${label}\n` +
          JSON.stringify(data, null, 2) +
          "\n\n" +
          logEl.textContent;
      }

      document.getElementById("btn-discover").onclick = async () => {
        try {
          const data = await Aurif.discover();
          log("discover", data);
          statusEl.textContent = "discovered " + data.protocol;
        } catch (e) {
          log("error", { message: e.message, data: e.data });
        }
      };

      document.getElementById("btn-handshake").onclick = async () => {
        const scopes = document
          .getElementById("scopes")
          .value.split(",")
          .map((s) => s.trim());
        try {
          const siteKey = document.getElementById("site_key").value.trim();
          const data = await Aurif.handshake({
            agent_id: document.getElementById("agent_id").value.trim(),
            agent_version: "1.0",
            requested_scopes: scopes,
            purpose: document.getElementById("purpose").value.trim(),
            ...(siteKey ? { site_key: siteKey } : {}),
          });
          log("handshake", data);
          statusEl.textContent =
            "session · " + (data.granted_scopes || []).join("+");
        } catch (e) {
          log("error", { message: e.message, data: e.data });
          statusEl.textContent = "handshake failed";
        }
      };

      document.getElementById("btn-page").onclick = async () => {
        const path = document.getElementById("page_path").value.trim() || "/";
        try {
          const data = await Aurif.getPage(path);
          log("page " + path, data);
        } catch (e) {
          log("error", { message: e.message, data: e.data });
        }
      };

      document.getElementById("btn-add").onclick = async () => {
        try {
          const data = await Aurif.act("product.add:widget");
          log("action product.add:widget", data);
        } catch (e) {
          log("error", { message: e.message, data: e.data });
        }
      };

      document.getElementById("btn-audit").onclick = async () => {
        try {
          const data = await Aurif.audit();
          log("audit", data);
        } catch (e) {
          log("error", { message: e.message, data: e.data });
        }
      };
    </script>
  </body>
</html>
